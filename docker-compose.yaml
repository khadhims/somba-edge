services:
  go2rtc:
    image: alexxit/go2rtc
    container_name: go2rtc
    privileged: true
    restart: unless-stopped
    ports:
      - "1988:1988"
      - "8558:8558"
      - "8559:8559"
    volumes:
      - ./go2rtc/go2rtc.yaml:/config/go2rtc.yaml
      - ./data/recordings:/app/data/recordings
    environment:
      - TZ=UTC

  worker:
    build:
      context: .
      dockerfile: ./worker/Dockerfile
      args:
        REQUIREMENTS_FILE: ${REQUIREMENTS_FILE:-requirements.txt}
    container_name: somba-edge-worker
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    environment:
      - SERVER_API_URL=${SERVER_API_URL}
      - SERVER_WS_URL=${SERVER_WS_URL}
      - EDGE_API_KEY=${EDGE_API_KEY}
      - GO2RTC_URL=${GO2RTC_URL:-http://go2rtc:1988}
      - MODELS_DIR=${MODELS_DIR:-/app/models}
      - RECORDINGS_PATH=${RECORDINGS_PATH}
      - DB_PATH=${DB_PATH}
      - IMAGE_DIR=${IMAGE_DIR}
      - SYNC_INTERVAL=${SYNC_INTERVAL}
      - BATCH_SIZE=${BATCH_SIZE}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET=${S3_BUCKET}
      - S3_REGION=${S3_REGION}
      - EDGE_DEV_MODE=${EDGE_DEV_MODE:-false}
      - GO2RTC_RTSP_HOST=${GO2RTC_RTSP_HOST:-go2rtc}
      - GO2RTC_RTSP_PORT=${GO2RTC_RTSP_PORT:-8558}
      - DEV_CAPTURE_WIDTH=${DEV_CAPTURE_WIDTH:-1280}
      - DEV_CAPTURE_HEIGHT=${DEV_CAPTURE_HEIGHT:-720}
      - YOLO_CONFIG_DIR=/tmp/Ultralytics
      - WORKER_STAGGER_SEC=${WORKER_STAGGER_SEC:-2}
      - PERSON_MODEL=${PERSON_MODEL:-yolov5su.pt}
      - VIOLATION_MODEL=${VIOLATION_MODEL:-best.pt}
    depends_on:
      - go2rtc
