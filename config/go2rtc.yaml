# Konfigurasi go2rtc — edit manual per site.
# Tambahkan stream RTSP di bawah, lalu salin URL HLS ke master data kamera (stream_url).
#
# Contoh:
#   streams:
#     {camera-uuid}_main:
#       - ffmpeg:rtsp://admin:pass@192.168.1.64:554/...#video=copy#audio=copy
#     {camera-uuid}_sub:
#       - ffmpeg:rtsp://admin:pass@192.168.1.64:554/...#video=copy#audio=none
#
# URL HLS: http://IP:1984/api/stream.m3u8?src={camera-uuid}_main

log:
  level: info

api:
  listen: ":1984"

rtsp:
  listen: ":8554"

webrtc:
  listen: ":8555"

streams: {}
